# Application bindings
$brave_browser = brave
$thorium_browser = thorium-browser
$messenger = Telegram
$music = pithos
$password_manager = bitwarden-desktop
$yazi_file_manager = "run-yazi.sh"

# Add bindings
# Close focused window
bindd = SUPER, Q, Close window, killactive,

# MBA: Keyboard LED Brightness
