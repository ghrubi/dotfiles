# Keyboard backlight timeout configuration for brightnessctl
listener {
    timeout = 10
    # For MBA
    # on-timeout = sh -c 'brightnessctl -d smc::kbd_backlight g > /tmp/kbd_brightness && brightnessctl -d smc::kbd_backlight s 0'
    # on-resume = sh -c 'val=$(cat /tmp/kbd_brightness 2>/dev/null || echo 50); brightnessctl -d smc::kbd_backlight s "$val"'
    # For MBP
    on-timeout = sh -c 'brightnessctl -d :white::kbd_backlight g > /tmp/kbd_brightness && brightnessctl -d :white:kbd_backlight s 0'
    on-resume = sh -c 'val=$(cat /tmp/kbd_brightness 2>/dev/null || echo 50); brightnessctl -d :white:kbd_backlight s "$val"'
}

